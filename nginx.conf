# The playground's GPUI frame runs on shared memory, which only a cross-origin isolated page gets.
map $uri $coop {
	~^/playground(\.html)?(/|$) same-origin;
}
map $uri $coep {
	~^/playground(\.html)?(/|$) require-corp;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	# CapRover terminates TLS in front, so a redirect naming this server's own scheme and port would leave https.
	absolute_redirect off;

	charset utf-8;
	charset_types text/css text/markdown text/plain text/javascript application/javascript application/json image/svg+xml;

	gzip on;
	gzip_static on;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/css text/markdown text/plain text/javascript application/javascript application/json application/wasm image/svg+xml;

	# Not every file name is hashed (main.js, the wasm), so a page and its scripts are always revalidated together.
	add_header Cache-Control no-cache;
	add_header Cross-Origin-Opener-Policy $coop;
	add_header Cross-Origin-Embedder-Policy $coep;

	location = /playground/ {
		return 301 /playground.html$is_args$args;
	}

	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	location ~ \.md$ {
		default_type text/markdown;
	}
}
