name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  bun:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Deps come from npm either way — one lockfile, and Bun runs against it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - run: npm run bun:test
