name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Deps come from npm either way — one lockfile, and Bun runs against it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - run: npm run bun:test
