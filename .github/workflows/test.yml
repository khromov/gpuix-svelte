name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm test

  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Deps come from npm either way — one lockfile, and Bun runs against it.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - run: npm run bun:test

  # gpuix compiles TestGpuixRenderer only on macOS and Windows — it needs
  # render_to_image, which the Vulkan/wgpu backend lacks — so the suites cannot
  # run here. This checks the binding still loads, which is what the demos need.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm run typecheck
      - run: node -e "const n = require('@gpuix/native'); if (typeof n.GpuixRenderer !== 'function') { console.error('GpuixRenderer missing from the linux prebuild'); process.exit(1) } console.log('binding ok')"

  # Build-only: a runner has no display. It checks that the bundle resolves with the
  # custom-renderer condition and that the addon gets embedded (scripts/compile.ts asserts both).
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - run: npm run compile
