name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
        node-version: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm test

  # The consumer path: pack the tarball, scaffold an app, install the tarball into it with npm
  # and with Bun, then typecheck, run its headless test, and (Bun pass) build it.
  consume:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run consume
      - run: npm run bun:consume

  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run bun:test

  # gpuix compiles TestGpuixRenderer only on macOS and Windows — it needs
  # render_to_image, which the Vulkan/wgpu backend lacks — so the suites cannot
  # run here. This checks the binding still loads, which is what the demos need.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm pack --dry-run
        working-directory: packages/create-gpuix-svelte
      # Since native 0.11 the binding links gpui's X11 client, and a runner has no desktop libs.
      - run: sudo apt-get update && sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0
      - run: node -e "const n = require('@gpuix/native'); if (typeof n.GpuixRenderer !== 'function') { console.error('GpuixRenderer missing from the linux prebuild'); process.exit(1) } console.log('binding ok')"

  # Build-only: a runner has no display. It checks that the bundle resolves with the
  # custom-renderer condition and that the addon gets embedded (scripts/compile.ts asserts both).
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run compile
