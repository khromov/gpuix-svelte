name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, windows-11-arm]
        node-version: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm test

  # The consumer path: pack the tarball, scaffold an app, install the tarball into it with npm
  # and with Bun, then typecheck, run its headless test (none on Linux), and (Bun pass) build it
  # and check its packaging.
  consume:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, windows-11-arm, ubuntu-latest]
        node-version: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run consume
      - run: npm run bun:consume

  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run bun:test

  # gpuix compiles TestGpuixRenderer only on macOS and Windows — it needs
  # render_to_image, which the Vulkan/wgpu backend lacks — so most suites cannot
  # run here. This runs the ones that need no headless renderer and drives a real window.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm pack --dry-run
        working-directory: packages/create-gpuix-svelte
      # Since native 0.11 the binding links gpui's X11 client, and a runner has no desktop libs.
      - run: sudo apt-get update && sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0 xvfb mesa-vulkan-drivers
      - run: node -e "const n = require('@gpuix/native'); if (typeof n.GpuixRenderer !== 'function') { console.error('GpuixRenderer missing from the linux prebuild'); process.exit(1) } console.log('binding ok')"
      - run: npm run test:bundle
      - run: npm run bun:test:bundle
      - run: npm run test:update
      - run: npm run bun:test:update
      # The browser bundle, which the `browser` condition of every export has to keep buildable.
      - run: npm run demo:web -- --build-only
      - run: npm run test:compile
      - run: npm run bun:test:compile
      # A runner has no display or GPU, so Xvfb and Mesa's software Vulkan stand in for them.
      - run: xvfb-run -a npm run test:automation-live
      - run: xvfb-run -a npm run bun:test:automation-live

  # Build-only: a runner has no display. It checks that the bundle resolves with the
  # custom-renderer condition, that the addon gets embedded (gpuix-svelte/build asserts both)
  # and that each OS's packaging runs: the .app and icns on macOS, the .ico and version info on Windows.
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run compile -- --archive
      # The release side of gpuix-svelte/update over the fragment this build wrote.
      - run: |
          key=$(node bin/gpuix-svelte.js update keygen --out dist/update-key.pem 2>/dev/null)
          node bin/gpuix-svelte.js update manifest --out dist/update.json --base-url https://example.com/ --key dist/update-key.pem --public-key "$key" dist/update-*.json
          node bin/gpuix-svelte.js update verify --public-key "$key" dist/update.json
        shell: bash
        env:
          # Git Bash would rewrite a key starting with `/` into a Windows path.
          MSYS_NO_PATHCONV: 1
