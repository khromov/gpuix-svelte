[package]
name = "rust-embed"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hello-core = { path = "../../rust-interop/rust/hello-core" }
# Cargo.lock is committed: rustyscript 0.12.3's deno_ast pins an swc_common that does not
# compile against serde 1.0.220+, so the lock holds serde 1.0.219 and the few crates that
# would drag serde_core in (time, bstr, bitflags, kqueue, indexmap, serde_json, uuid).
rustyscript = { version = "0.12", features = ["node_experimental", "fs_import"] }

[profile.release]
opt-level = "s"


[build-dependencies]
deno_napi = "0.144.0"
