<!doctype html>
<!-- Served by scripts/web.ts. GPUI appends the canvas itself; this page only sizes it. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
		<link rel="icon" href="data:," />
		<title>GPUIX + Svelte — Tic-tac-toe</title>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1e1e2e;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
				touch-action: none;
			}
			/* The app draws every glyph itself, so the page must not behave like a
			   document: a long press would select the body and pop the iOS callout. */
			html,
			body,
			canvas {
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			/* GPUI's hidden IME textarea still needs a real selection for
			   composition, backspace context, and clipboard. */
			[data-gpui-input] {
				-webkit-user-select: text !important;
				user-select: text !important;
			}
			#loading {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #6c7086;
				font: 14px system-ui, sans-serif;
			}
			body:has(canvas) #loading {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="loading">Starting the GPUI renderer…</div>
		<script type="module" src="/app.js"></script>
	</body>
</html>
