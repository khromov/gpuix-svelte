[workspace]
resolver = "2"
members = ["crates/gpuix-svelte-embed", "examples/rust-host"]

# Mirrors gpuix-native: screenshot encoding is unusable at opt-level 0.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = true
