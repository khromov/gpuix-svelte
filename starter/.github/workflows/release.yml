name: release

# release-please keeps a release PR open from the conventional commits (feat:, fix:, …) on main.
# Merging it tags a release; then every platform builds the app and uploads its archive, and one
# job merges the build fragments into update.json, which the app checks at
# https://github.com/<owner>/<repo>/releases/latest/download/update.json (see the Updating page
# of the gpuix-svelte docs). The macOS signing secrets and GPUIX_UPDATE_KEY are optional.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12
      - run: bun build.ts --archive
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # nullglob drops the extension this platform did not make; --clobber lets a re-run replace its upload.
      - run: shopt -s nullglob; gh release upload --clobber "$TAG" dist/*.zip dist/*.tar.gz
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.os }}
          path: dist/update-*.json

  # Runs even when a platform failed to build, so the others still get their update; the
  # manifest then lists only what was uploaded. Until it runs, the new release's manifest is a
  # 404 and apps keep their version.
  manifest:
    needs: [release, build]
    if: ${{ !cancelled() && needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: fragments
      - run: gh release view "$TAG" --json body --jq .body > notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
      # --no-install: the bin comes from the gpuix-svelte in node_modules, never from the registry.
      # With the GPUIX_UPDATE_PUBLIC_KEY variable set, an unsigned or wrongly signed manifest
      # fails here instead of being refused by every app in the field.
      - run: |
          bunx --no-install gpuix-svelte update manifest --out update.json \
            --base-url "https://github.com/$REPO/releases/download/$TAG/" \
            --notes notes.md --url "https://github.com/$REPO/releases/tag/$TAG" \
            ${PUBLIC_KEY:+--public-key "$PUBLIC_KEY"} \
            fragments/*.json
          gh release upload --clobber "$TAG" update.json
        env:
          GH_TOKEN: ${{ github.token }}
          GPUIX_UPDATE_KEY: ${{ secrets.GPUIX_UPDATE_KEY }}
          PUBLIC_KEY: ${{ vars.GPUIX_UPDATE_PUBLIC_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag_name }}
