<style>
@font-face{font-family:Geist;src:url(assets/fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
--bg:#000;--s1:#0a0a0a;--s3:#171717;
--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.13);--line-3:rgba(255,255,255,.22);
--text:#ededed;--text-2:#a1a1a1;--text-3:#8f8f8f;
--accent:#ff3e00;
--sans:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit}
p,figure{margin:0}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:56px;padding:0 32px;background:var(--bg);border-bottom:1px solid var(--line)}
.home{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.home svg{width:22px;height:22px}
.home span{margin-left:4px;font-weight:400;color:var(--text-3)}
main{max-width:1280px;margin:0 auto;padding:32px}
.lead{max-width:68ch;color:var(--text-2);text-wrap:pretty}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:32px 28px;margin-top:28px}
.slot{display:grid;place-items:center;padding:clamp(20px,6%,40px);border-radius:12px;background:repeating-conic-gradient(#262626 0 25%,#1c1c1c 0 50%) 0 0/20px 20px;box-shadow:0 0 0 1px var(--line-2)}
.slot svg{display:block;width:100%;height:auto}
figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
figcaption b{margin-right:auto;font-weight:600;letter-spacing:-.015em}
.save{appearance:none;height:30px;padding:0 12px;font:500 12.5px/1 var(--sans);color:var(--text);background:var(--s3);border:1px solid var(--line-2);border-radius:7px;white-space:nowrap;cursor:pointer}
.save:hover{background:#1f1f1f;border-color:var(--line-3)}
.save:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.save:disabled{color:var(--text-3);cursor:progress}
@media (max-width:640px){
.top{padding:0 16px}
main{padding:24px 16px}
}
</style>
</head>

36 815.93 172.54Q817.17 173.72 819.41 173.72L824.01 173.72L824.01 185.4ZM850.96 185.4Q841.52 185.4 837.1 181.03Q832.67 176.67 832.67 167.35L832.67 107.64L847.78 107.64L847.78 165.93Q847.78 170.3 849.66 172.01Q851.55 173.72 855.56 173.72L864.41 173.72L864.41 185.4ZM822.76 134.07L822.76 122.39L864.41 122.39L864.41 134.07ZM898.14 186.82Q888.7 186.82 881.74 182.75Q874.77 178.67 871 171.24Q867.22 163.81 867.22 153.89Q867.22 143.98 871 136.61Q874.77 129.23 881.68 125.1Q888.58 120.97 897.78 120.97Q906.75 120.97 913.54 124.98Q920.32 129 923.98 136.55Q927.64 144.1 927.64 154.72L927.64 158.14L882.92 158.14Q883.39 166.4 887.46 170.59Q891.53 174.78 898.26 174.78Q903.33 174.78 906.69 172.48Q910.06 170.18 911.35 166.05L926.81 166.99Q924.22 176.2 916.6 181.51Q908.99 186.82 898.14 186.82ZM882.92 147.99L912.06 147.99Q911.59 140.32 907.7 136.61Q903.8 132.89 897.78 132.89Q891.77 132.89 887.81 136.78Q883.86 140.68 882.92 147.99Z';
const [WIDTH, HEIGHT, RADIUS] = [1000, 300, 72];
const PNG_WIDTH = 4800;
const PNG_HEIGHT = PNG_WIDTH * HEIGHT / WIDTH;
const DPI = 300;
const COLOURS = [
	{ id: 'dark', name: 'Dark', bg: '#000', body: '#fff', tip: '#ff3e00', text: '#fff' },
	{ id: 'light', name: 'Light', bg: '#fff', body: '#0a0a0a', tip: '#ff3e00', text: '#0a0a0a' },
	{ id: 'orange', name: 'Orange', bg: '#ff3e00', body: '#000', tip: '#000', text: '#000' }
];

const sticker = (c, width = WIDTH, height = HEIGHT) => `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${WIDTH} ${HEIGHT}" role="img"><title>gpuix-svelte</title><rect width="${WIDTH}" height="${HEIGHT}" rx="${RADIUS}" fill="${c.bg}"/><g transform="translate(56 64) scale(2.68)"><path d="M27 13 9 32l18 19" fill="none" stroke="${c.body}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 13 57 32 36 51Z" fill="${c.tip}" stroke="${c.tip}" stroke-width="5" stroke-linejoin="round"/></g><path d="${WORDMARK}" fill="${c.text}"/></svg>`;

const inches = (px) => Math.round(px / DPI * 10) / 10;
document.getElementById('lead').textContent = `Rounded-rectangle stickers of the logo and wordmark. The PNG is ${PNG_WIDTH} × ${PNG_HEIGHT} px with transparent corners, ${inches(PNG_WIDTH)} × ${inches(PNG_HEIGHT)} in at ${DPI} DPI; the SVG is the same artwork in vector, with the text as outlines.`;

const sheet = document.getElementById('sheet');
sheet.innerHTML = COLOURS.map((c) => `
	<figure>
		<div class="slot">${sticker(c)}</div>
		<figcaption><b>${c.name}</b><button class="save" type="button" data-id="${c.id}" data-format="png">PNG, ${PNG_WIDTH} × ${PNG_HEIGHT}</button><button class="save" type="button" data-id="${c.id}" data-format="svg">SVG</button></figcaption>
	</figure>`).join('');

async function png(svg) {
	const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
	try {
		const image = new Image();
		image.src = url;
		await image.decode();
		const canvas = Object.assign(document.createElement('canvas'), { width: PNG_WIDTH, height: PNG_HEIGHT });
		canvas.getContext('2d').drawImage(image, 0, 0, PNG_WIDTH, PNG_HEIGHT);
		return await new Promise((done, fail) => canvas.toBlob((blob) => (blob ? done(blob) : fail(new Error('the canvas produced no PNG'))), 'image/png'));
	} finally {
		URL.revokeObjectURL(url);
	}
}

function save(blob, name) {
	const url = URL.createObjectURL(blob);
	Object.assign(document.createElement('a'), { href: url, download: name }).click();
	setTimeout(() => URL.revokeObjectURL(url), 10_000);
}

sheet.addEventListener('click', async (e) => {
	const button = e.target.closest('.save');
	if (!button) return;
	const colour = COLOURS.find((c) => c.id === button.dataset.id);
	const name = `gpuix-svelte-sticker-${colour.id}.${button.dataset.format}`;
	if (button.dataset.format === 'svg') {
		save(new Blob([sticker(colour)], { type: 'image/svg+xml' }), name);
		return;
	}
	const label = button.textContent;
	button.disabled = true;
	button.textContent = 'Rendering…';
	try {
		save(await png(sticker(colour, PNG_WIDTH, PNG_HEIGHT)), name);
		button.textContent = label;
	} catch (error) {
		console.error(error);
		button.textContent = 'Failed, see console';
	}
	button.disabled = false;
});
